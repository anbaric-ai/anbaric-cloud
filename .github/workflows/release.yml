name: Release

# On merge to main: if the version in package.json isn't on npm yet, run the
# suite, publish every workspace, tag, and pin the version in
# anbaric-cloud-central (which triggers the staging platform redeploy there).
# The version is the single source in the root package.json - bump it in your
# merge; this workflow publishes exactly that version and no image is built here
# (the platform ships as npm packages).

on:
  push:
    branches: [ main ]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish and roll staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "anbaric@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "anbaric@$VERSION is already on npm - nothing to release."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Releasing anbaric@$VERSION."
          fi

      - name: Test
        if: steps.version.outputs.published == 'false'
        run: npx vitest run

      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspaces --access public --tag latest

      - name: Tag the release
        if: steps.version.outputs.published == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "v$VERSION" -m "Release v$VERSION" || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "v$VERSION" || true

      - name: Pin platform version in anbaric-cloud-central (triggers deploy)
        if: steps.version.outputs.published == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/anbaric-ai/anbaric-cloud-central.git" central
          cd central
          echo "$VERSION" > PLATFORM_VERSION
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if git diff --quiet; then
            echo "PLATFORM_VERSION already $VERSION"
          else
            git add PLATFORM_VERSION
            git commit -m "chore: platform $VERSION"
            git push origin main
          fi
